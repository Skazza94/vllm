# Example topology (the only one tracked; copy it to make others):
# a prefill and a decode node with two data rails (one per tensor-parallel
# rank, say), and a control network they share with the client and the
# gateway (llm-d's router).
#
#   python -m harness up topologies/example.yaml   # from tools/e2e/
#   python -m harness status example
#   python -m harness exec example prefill0 ip -br addr
#   python -m harness down example
#
# Every network is a star: one router container in the middle and one veth
# from each of the network's nodes to it, no bridges. Link k of a network
# (its k-th node, in spec order) is a /31 of its subnet: the router holds
# the even address, the node the odd one. A node's interface is named after
# the network and routes only that subnet (no default route). Each node's
# /etc/hosts has <node>.<network>, and /e2e/topology.json describes the
# topology. Containers start with --network none; the host wires them with
# `sudo nsenter ... ip/tc`, so password-less sudo for ip, tc and nsenter is
# needed. Veths are memory copies, not NICs: no absolute network numbers.

# Lowercase letters, digits and dashes; prefixes the containers' names
# (<name>-<node>, <name>-router-<network>).
name: example

# Nodes' default image (default vllm:cpu, built by
# docker/Dockerfile.cpu).
image: vllm:cpu

# Routers' image (default python:3.12-slim) and their cpuset (default none).
# router_image: python:3.12-slim
routers:
  cpus: "15"

networks:
  # Names are interface names: a letter, then up to 14 letters or digits.
  control:
    subnet: 10.250.0.0/24  # required; subnets must not overlap
  data0:
    subnet: 10.100.0.0/24
    mtu: 9000  # default 1500; a benchmark parameter: it sets the TCP segment size
    # Optional egress shaping of each link, both ways (tc netem): a path
    # between two nodes crosses two links, so it sees the rate once and the
    # delay twice.
    # rate: 100gbit     # tc rate: bit, kbit, mbit, gbit or tbit
    # delay: 50us       # tc time: us, ms or s
    # queue_limit: 10000  # netem's queue, in packets (default 10000)
  data1:
    subnet: 10.101.0.0/24
    mtu: 9000

nodes:
  # Names: lowercase letters, digits and dashes, not starting with router-.
  prefill0:
    networks: [control, data0, data1]  # required, each at most once
    # A network joined with several links, {kv: 8}: a link (interface
    # <network>r<k>, its own /31) per rank, a socket bound to link k's
    # address leaving on link k; `up` checks every such link both ways.
    cpus: "0-6"     # docker --cpuset-cpus (default: no limit)
    memory: 24g     # docker --memory (default: no limit)
    # image: vllm:cpu  # this node's image (default: the spec's)
    # Extra `docker run` options, for example a larger /dev/shm (needed for
    # tensor parallelism) or sources mounted over the image's:
    # docker_args: ["--shm-size", "4g",
    #   "-v", "/abs/path/vllm-decaf/vllm/v1/worker/simulated:/opt/venv/lib/python3.12/site-packages/vllm/v1/worker/simulated:ro"]
  decode0:
    networks: [control, data0, data1]
    cpus: "7-13"
    memory: 24g
  # llm-d's Envoy and endpoint picker run in containers that join this
  # node's network namespace and get its cpus (a decode node's sidecar
  # likewise gets decode's). Here the gateway shares CPU 15 with the network
  # routers above, apart from the client and the servers: enough for a
  # functional run, not an isolated router for performance numbers (give it
  # cores of its own for those).
  gateway:
    networks: [control]
    cpus: "15"
  client:
    networks: [control]
    cpus: "14"
